name: Validate gateway

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.32.0
      - name: Validate repository configuration
        run: |
          python3 -m pip install -r control-plane/requirements.txt
          python3 -m unittest discover -s control-plane -v
          PYTHONPATH=control-plane python3 -c 'import json; from app import generate, validate; from test_app import sample; open("tests/generated-kong.json", "w").write(json.dumps(generate([validate(sample())], "https://mcp.example.com")))'
          PYTHONPATH=control-plane python3 - <<'PY'
          import json
          from app import generate, validate
          from test_app import sample
          config = generate([validate(sample())], "https://mcp.example.com")
          config["services"][0]["routes"][0]["plugins"].append({"name": "mcp-token-exchange", "config": {
              "token_endpoint": "https://sts.example.com/token", "gateway_resource": "https://mcp.example.com/mcp/server-a",
              "resource": "https://backend.example.com/mcp", "client_id": "gateway-client",
              "client_secret_file": "/var/run/secrets/token-exchange/client-secret", "scopes": ["tools:read"]}})
          with open("tests/exchange-kong.json", "w") as output: json.dump(config, output)
          PY
          node --check control-plane/static/app.js
          sh -n tests/smoke.sh
          ruby tests/validate-config.rb
          kubectl kustomize deploy/openshift > /tmp/mcp-gateway-rendered.yaml
          ruby -e 'require "yaml"; docs = YAML.load_stream(File.read("/tmp/mcp-gateway-rendered.yaml")); abort "unexpected rendered resource count" unless docs.length == 3'
      - name: Validate optional control plane deployment
        run: |
          kubectl kustomize deploy/control-plane > /tmp/mcp-control-plane-rendered.yaml
          ruby tests/validate-control-plane.rb
          docker build --tag mcp-control-plane:ci control-plane
          docker run --rm --read-only --tmpfs /data:rw,nosuid,nodev,size=32m --env TMPDIR=/data --user 12345:0 \
            --volume "$PWD/control-plane/test_app.py:/app/test_app.py:ro" \
            --volume "$PWD/control-plane/test_oidc.py:/app/test_oidc.py:ro" mcp-control-plane:ci \
            python -m unittest -v test_app test_oidc
      - name: Build Kong OSS image
        run: docker build --build-arg KONG_VERSION=3.9.0 --tag mcp-gateway:ci .
      - name: Validate plugin, declarative config, and arbitrary-UID runtime
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --user 12345:0 --volume "$PWD/tests:/tests:ro" --entrypoint /bin/sh mcp-gateway:ci -ec '
              luajit /tests/handler_spec.lua
              luajit /tests/token_exchange_spec.lua
              kong config parse /tests/exchange-kong.json >/dev/null
              kong config parse /etc/kong/kong.yml >/dev/null
              kong config parse /tests/generated-kong.json >/dev/null
              kong prepare
            '
      - name: Start image with restricted filesystem and arbitrary UID
        run: |
          docker run --detach --name mcp-gateway-scc-test --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m --user 12345:0 \
            --publish 127.0.0.1:18100:8100 --publish 127.0.0.1:18000:8000 mcp-gateway:ci
          trap 'docker rm -f mcp-gateway-scc-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18100/status >/dev/null; then
              python3 tests/routing.py
              exit 0
            fi
            sleep 2
          done
          docker logs mcp-gateway-scc-test
          exit 1
