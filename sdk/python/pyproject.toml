[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "foss-agentic-gateway-sdk"
version = "0.1.0"
description = "Gateway-only MCP/A2A clients and verification of exchanged backend tokens"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyJWT[crypto]==2.15.1", "cryptography==50.0.2"]
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
