apiVersion: v1
kind: ServiceAccount
metadata:
  name: foss-agentic-control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foss-agentic-control-plane-publisher
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [foss-agentic-gateway-kong]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [foss-agentic-gateway]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foss-agentic-control-plane-publisher
subjects:
  - kind: ServiceAccount
    name: foss-agentic-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foss-agentic-control-plane-publisher
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foss-agentic-control-plane-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: foss-agentic-control-plane
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: foss-agentic-control-plane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foss-agentic-control-plane
    spec:
      serviceAccountName: foss-agentic-control-plane
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: foss-agentic-control-plane:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: AUTH_MODE
              value: oidc
            - name: OIDC_ISSUER
              valueFrom:
                secretKeyRef:
                  name: foss-agentic-control-plane-oidc
                  key: issuer
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: foss-agentic-control-plane-oidc
                  key: client-id
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: foss-agentic-control-plane-oidc
                  key: client-secret
            - name: OIDC_ADMIN_CLAIM
              value: /roles
            - name: OIDC_ADMIN_VALUE
              value: agentic-admin
            - name: OIDC_ADMIN_CLAIM_SOURCE
              value: id_token
            - name: OIDC_TOKEN_AUTH_METHOD
              value: client_secret_basic
            - name: CONTROL_PLANE_PUBLIC_URL
              value: https://control.agentic.example.com
            - name: GATEWAY_PUBLIC_URL
              value: https://mcp.example.com
            - name: PUBLISH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: foss-agentic-control-plane-data
---
apiVersion: v1
kind: Service
metadata:
  name: foss-agentic-control-plane
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: foss-agentic-control-plane
  ports:
    - name: http
      port: 8080
      targetPort: http
