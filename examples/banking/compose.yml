name: banking-examples

x-service: &service
  user: "1001:0"
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

x-infrastructure: &infrastructure
  <<: *service
  image: open-agentic-banking-infrastructure:local
  build:
    context: ../..
    dockerfile: examples/banking/infrastructure/Dockerfile

x-backend-health: &backend-health
  test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
  interval: 2s
  timeout: 3s
  retries: 30

services:
  prepare:
    <<: *infrastructure
    profiles: [tools]
    user: "0:0"
    command: [-m, banking_demo.prepare]
    network_mode: none
    volumes:
      - issuer-credentials:/runtime/issuer
      - gateway-credentials:/runtime/gateway
      - backend-credentials:/runtime/backend
      - agent-credentials:/runtime/client

  issuer:
    <<: *infrastructure
    command: [-m, banking_demo.issuer]
    volumes: ["issuer-credentials:/credentials:ro"]
    networks: [agents, backends]
    healthcheck:
      test: [CMD, python, -c, "import ssl, urllib.request; urllib.request.urlopen('https://localhost:8443/healthz', context=ssl.create_default_context(cafile='/credentials/ca.pem'), timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  review-agent:
    <<: *service
    image: open-agentic-banking-review-agent:local
    build:
      context: ../..
      dockerfile: examples/banking/transaction-review-agent/Dockerfile
    volumes: ["backend-credentials:/credentials:ro"]
    networks: [backends]
    healthcheck: *backend-health

  accounts:
    <<: *service
    image: open-agentic-banking-accounts:local
    build:
      context: ../..
      dockerfile: examples/banking/accounts-mcp-server/Dockerfile
    volumes: ["backend-credentials:/credentials:ro"]
    networks: [backends]
    healthcheck: *backend-health

  transactions:
    <<: *service
    image: open-agentic-banking-transactions:local
    build:
      context: ../..
      dockerfile: examples/banking/transactions-mcp-server/Dockerfile
    volumes: ["backend-credentials:/credentials:ro"]
    networks: [backends]
    healthcheck: *backend-health

  gateway:
    image: ${BANKING_GATEWAY_IMAGE:-open-agentic-gateway:banking}
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    user: "1001:0"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    environment:
      KONG_PROXY_LISTEN: 0.0.0.0:8443 ssl
      KONG_SSL_CERT: /credentials/tls.pem
      KONG_SSL_CERT_KEY: /credentials/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: /credentials/ca.pem
    volumes:
      - ./kong.yml:/etc/kong/kong.yml:ro
      - gateway-credentials:/credentials:ro
    ports: ["127.0.0.1:8443:8443"]
    networks: [agents, backends]
    depends_on:
      issuer: {condition: service_healthy}
      review-agent: {condition: service_healthy}
      accounts: {condition: service_healthy}
      transactions: {condition: service_healthy}
    healthcheck:
      test: [CMD, kong, health]
      interval: 2s
      timeout: 5s
      retries: 30

  banking-orchestrator:
    <<: *service
    profiles: [tools]
    image: open-agentic-banking-orchestrator:local
    build:
      context: ../..
      dockerfile: examples/banking/banking-orchestrator/Dockerfile
    volumes: ["agent-credentials:/credentials:ro"]
    networks: [agents]
    depends_on:
      gateway: {condition: service_healthy}

networks:
  agents:
  backends:
    internal: true

volumes:
  issuer-credentials:
  gateway-credentials:
  backend-credentials:
  agent-credentials:
